name: hoot_portal
description: "تطبيق بورتال الصيدليات - مستودع أدوية الحوت"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: 4.10.0
  mobile_scanner: 6.0.2
  url_launcher: 6.3.1
  shared_preferences: 2.3.3
  connectivity_plus: 6.1.0
  google_fonts: 6.2.1
  http: 1.2.2
  html: 0.15.4

dev_dependencies:
  flutter_launcher_icons: 0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo_full.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FCFCFE"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21
