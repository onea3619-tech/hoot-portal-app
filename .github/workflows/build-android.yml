name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older build, so the release always has the latest code
concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org com.alhoot --project-name hoot_portal --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Dependencies and icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hoot-portal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Fixed download name
        run: cp build/app/outputs/flutter-apk/app-release.apk hoot-alhoot.apk

      # Stable link: /releases/latest/download/hoot-alhoot.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "تطبيق الحوت - آخر نسخة"
          body: "آخر نسخة تجريبية من تطبيق الحوت (Android). البناء رقم ${{ github.run_number }}."
          files: hoot-alhoot.apk
          make_latest: true
